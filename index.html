<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>چک‌لیست روزانه</title>
<meta name="theme-color" content="#FAF5EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="چک‌لیست">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231E3A4F'/%3E%3Cpath d='M55 92l25 25 45-55' stroke='%23FAF5EA' stroke-width='14' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF5EA;
    --cream-deep:#F1EAD6;
    --card:#FFFFFF;
    --carbon:#1E3A4F;
    --carbon-soft:#33566E;
    --line:#E7DCC2;
    --muted:#8B7E63;
    --danger:#C0564D;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
    background:var(--cream);
    color:var(--carbon);
    min-height:100vh;
    min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:520px;margin:0 auto;padding:28px 20px 48px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{
    width:40px;height:40px;border-radius:14px;background:var(--carbon);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .logo svg{width:22px;height:22px;}
  h1{font-size:20px;font-weight:900;margin:0;letter-spacing:-.2px;}
  .today-btn{
    font-family:inherit;font-size:13px;font-weight:700;color:var(--carbon);
    background:transparent;border:1.5px solid var(--carbon);border-radius:999px;
    padding:7px 16px;cursor:pointer;
  }
  .today-btn:active{background:var(--cream-deep);}
  .date-card{
    background:var(--carbon);color:var(--cream);
    border-radius:24px;padding:22px 20px;margin:18px 0;
    box-shadow:0 10px 28px rgba(30,58,79,.22);
  }
  .date-nav{display:flex;align-items:center;justify-content:space-between;}
  .nav-btn{
    width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(250,245,234,.35);
    background:transparent;color:var(--cream);font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .nav-btn:active{background:rgba(250,245,234,.15);}
  .date-text{text-align:center;flex:1;}
  .date-weekday{font-size:14px;font-weight:500;opacity:.75;margin-bottom:2px;}
  .date-main{font-size:24px;font-weight:900;}
  .progress{margin-top:16px;}
  .progress-label{display:flex;justify-content:space-between;font-size:13px;font-weight:500;opacity:.85;margin-bottom:8px;}
  .progress-track{height:10px;border-radius:999px;background:rgba(250,245,234,.22);overflow:hidden;}
  .progress-fill{height:100%;border-radius:999px;background:var(--cream);width:0%;transition:width .8s cubic-bezier(.32,.72,0,1);}
  /* day-change slide (iOS-style page transition) */
  @keyframes outL{to{transform:translateX(-36px);opacity:0;}}
  @keyframes outR{to{transform:translateX(36px);opacity:0;}}
  @keyframes inFromR{from{transform:translateX(36px);opacity:0;}to{transform:none;opacity:1;}}
  @keyframes inFromL{from{transform:translateX(-36px);opacity:0;}to{transform:none;opacity:1;}}
  .pg-next-out #content>*{animation:outL .28s ease-in forwards;}
  .pg-prev-out #content>*{animation:outR .28s ease-in forwards;}
  .pg-next-in #content>*{animation:inFromR .55s cubic-bezier(.32,.72,0,1);}
  .pg-prev-in #content>*{animation:inFromL .55s cubic-bezier(.32,.72,0,1);}
  /* weekly report */
  .report-link{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;margin-top:14px;padding:15px;
    background:var(--card);border:1.5px solid var(--line);border-radius:20px;
    font-family:inherit;font-size:15px;font-weight:700;color:var(--carbon);
    cursor:pointer;transition:transform .2s ease;
  }
  .report-link:active{transform:scale(.97);}
  .report-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .back-btn{
    width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);
    background:var(--card);color:var(--carbon);font-size:22px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .2s ease;flex:none;
  }
  .back-btn:active{transform:scale(.9);}
  .report-head h2{font-size:20px;font-weight:800;color:var(--carbon);margin:0;}
  .report-head p{font-size:13px;color:#8a7f6a;margin:3px 0 0;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center;}
  .stat-num{display:block;font-size:21px;font-weight:800;color:var(--carbon);line-height:1.4;}
  .stat-label{font-size:12px;color:#8a7f6a;}
  .chart-card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px 10px 12px;}
  .chart{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;min-height:200px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;}
  .bar-count{font-size:14px;font-weight:800;color:var(--carbon);min-height:20px;white-space:nowrap;}
  .bar-count small{font-size:10px;font-weight:400;color:#b3a88f;}
  .bar-track{width:100%;max-width:36px;height:120px;background:#EFE6D2;border-radius:11px;display:flex;align-items:flex-end;overflow:hidden;}
  .bar-fill{width:100%;height:0;background:rgba(30,58,79,.32);border-radius:11px;transition:height .8s cubic-bezier(.32,.72,0,1);}
  .bar-col.best .bar-fill{background:var(--carbon);}
  .bar-col.best .bar-count{color:var(--carbon);}
  .bar-day{font-size:11px;color:#8a7f6a;font-weight:700;white-space:nowrap;}
  .bar-date{font-size:11px;color:#b3a88f;}
  .report-note{text-align:center;color:#8a7f6a;font-size:13.5px;margin:16px 6px 0;line-height:2;}
  .view-out-l{animation:outL .28s ease-in forwards;}
  .view-out-r{animation:outR .28s ease-in forwards;}
  .view-in-r{animation:inFromR .55s cubic-bezier(.32,.72,0,1);}
  .view-in-l{animation:inFromL .55s cubic-bezier(.32,.72,0,1);}
  .add-row{display:flex;gap:10px;margin:18px 0 6px;}
  .add-row input{
    flex:1;font-family:inherit;font-size:15px;color:var(--carbon);
    background:var(--card);border:1.5px solid var(--line);border-radius:999px;
    padding:13px 18px;outline:none;
  }
  .add-row input:focus{border-color:var(--carbon);}
  .add-row input::placeholder{color:var(--muted);}
  .add-btn{
    font-family:inherit;font-size:15px;font-weight:800;color:var(--cream);
    background:var(--carbon);border:none;border-radius:999px;
    padding:0 26px;cursor:pointer;flex:none;
    transition:transform .2s ease,background .2s ease;
  }
  .add-btn:active{background:var(--carbon-soft);transform:scale(.95);}
  .today-btn,.nav-btn{transition:transform .2s ease;}
  .today-btn:active,.nav-btn:active{transform:scale(.9);}
  .list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .task{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border:1.5px solid var(--line);border-radius:20px;
    padding:13px 16px;
    position:relative;
  }
  .task.enter{animation:taskIn .65s cubic-bezier(.32,.72,0,1);}
  @keyframes taskIn{from{opacity:0;transform:translateY(-14px) scale(.97);}to{opacity:1;transform:none;}}
  .task.leaving{transition:opacity .35s ease,transform .35s ease !important;opacity:0 !important;transform:translateX(-40px) scale(.96) !important;}
  /* cobweb for tasks untouched for 12h */
  .task.cobweb{border-color:#e0d5bc;}
  .cobweb-svg{position:absolute;top:-12px;left:-12px;width:88px;height:88px;pointer-events:none;z-index:3;}
  .cobweb-svg path{stroke:#a79d86;stroke-width:1.4;fill:none;opacity:.9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:webDraw 1s ease forwards;}
  .cobweb-svg path:nth-child(n+6){animation-delay:.15s;}
  .cobweb-svg path:nth-child(n+10){animation-delay:.3s;}
  .cobweb-svg path:nth-child(n+14){animation-delay:.45s;}
  .cobweb-svg path:nth-child(n+18){animation-delay:.6s;}
  .cobweb-svg path:nth-child(n+22){animation-delay:.75s;}
  @keyframes webDraw{to{stroke-dashoffset:0;}}
  .cobweb-svg.falling{animation:webFall .7s ease-in forwards;}
  .cobweb-svg.falling path{animation:none;stroke-dashoffset:0;}
  @keyframes webFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(54px) rotate(30deg);opacity:0;}}
  .check{
    width:28px;height:28px;border-radius:50%;flex:none;cursor:pointer;
    border:2px solid var(--carbon);background:transparent;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .check svg{width:15px;height:15px;opacity:0;transform:scale(.5);transition:all .18s ease;}
  .check.pop{animation:checkPop .55s cubic-bezier(.32,.72,0,1);}
  @keyframes checkPop{0%{transform:scale(.55);}55%{transform:scale(1.18);}100%{transform:scale(1);}}
  .task.done .check{background:var(--carbon);}
  .task.done .check svg{opacity:1;transform:scale(1);}
  .task-text{flex:1;font-size:15px;font-weight:500;word-break:break-word;}
  .task.done .task-text{color:var(--muted);text-decoration:line-through;}
  .del{
    flex:none;width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
    background:transparent;color:var(--muted);font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .del:active{background:var(--cream-deep);color:var(--danger);}
  .empty{
    text-align:center;color:var(--muted);font-size:14px;font-weight:500;
    padding:38px 20px;border:1.5px dashed var(--line);border-radius:20px;margin-top:14px;
    background:rgba(255,255,255,.5);
  }
  .hint{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;font-weight:400;}
</style>
</head>
<body>
<div class="wrap">
 <div id="mainView">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l5 5L19 7" stroke="#FAF5EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>چک‌لیست روزانه</h1>
    </div>
    <button class="today-btn" id="todayBtn">امروز</button>
  </header>

  <div id="content">
  <section class="date-card">
    <div class="date-nav">
      <button class="nav-btn" id="prevBtn" aria-label="روز قبل">‹</button>
      <div class="date-text">
        <div class="date-weekday" id="weekday">—</div>
        <div class="date-main" id="dateMain">—</div>
      </div>
      <button class="nav-btn" id="nextBtn" aria-label="روز بعد">›</button>
    </div>
    <div class="progress">
      <div class="progress-label"><span>پیشرفت امروز</span><span id="progressText">۰ از ۰</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </section>

  <div class="add-row">
    <input id="taskInput" type="text" placeholder="یه کار جدید بنویس…" maxlength="140" autocomplete="off">
    <button class="add-btn" id="addBtn">افزودن</button>
  </div>

  <ul class="list" id="taskList"></ul>
  <div class="empty" id="emptyState">هنوز کاری برای این روز ثبت نشده.<br>اولین تسکت رو بالا بنویس.</div>
  </div>

  <p class="hint">تسک‌ها روی همین دستگاه ذخیره می‌شن.</p>
  <button class="report-link" id="reportBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E3A4F" stroke-width="2.4" stroke-linecap="round"><path d="M5 20v-7M12 20V6M19 20v-11"/></svg>
    گزارش هفتگی
  </button>
 </div>
 <section id="reportView" hidden>
   <div class="report-head">
     <button class="back-btn" id="backBtn" aria-label="بازگشت">›</button>
     <div>
       <h2>گزارش هفتگی</h2>
       <p>عملکرد ۷ روز اخیر</p>
     </div>
   </div>
   <div class="stats">
     <div class="stat"><span class="stat-num" id="statDone">۰</span><span class="stat-label">تسک انجام‌شده</span></div>
     <div class="stat"><span class="stat-num" id="statAvg">۰</span><span class="stat-label">میانگین روزانه</span></div>
     <div class="stat"><span class="stat-num" id="statBest">—</span><span class="stat-label">پرکارترین روز</span></div>
   </div>
   <div class="chart-card">
     <div class="chart" id="chart"></div>
   </div>
   <p class="report-note" id="reportNote"></p>
 </section>
</div>

<script>
(function(){
  "use strict";
  var FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  function faNum(s){ return String(s).replace(/[0-9]/g, function(d){ return FA_DIGITS[+d]; }); }
  function faToEn(s){ return String(s).replace(/[۰-۹]/g, function(d){ return FA_DIGITS.indexOf(d); }); }

  var STORE_KEY = 'checklist-v1';
  var store = {};
  try { store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e){ store = {}; }
  function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){} }

  var STALE_MS = 12*60*60*1000;
  (function(){
    var nowTs = Date.now(), dirty = false;
    Object.keys(store).forEach(function(k){
      (store[k]||[]).forEach(function(t){ if(!t.createdAt){ t.createdAt = nowTs; dirty = true; } });
    });
    if(dirty) save();
  })();

  function isStale(t){ return !t.done && t.createdAt && (Date.now() - t.createdAt >= STALE_MS); }
  var COBWEB_PATHS = '<path pathLength="1" d="M0 0 L72.0 0.0"/><path pathLength="1" d="M0 0 L66.5 27.6"/><path pathLength="1" d="M0 0 L50.9 50.9"/><path pathLength="1" d="M0 0 L27.6 66.5"/><path pathLength="1" d="M0 0 L0.0 72.0"/><path pathLength="1" d="M15.0 0.0 Q12.1 2.4 13.9 5.7"/><path pathLength="1" d="M13.9 5.7 Q10.2 6.8 10.6 10.6"/><path pathLength="1" d="M10.6 10.6 Q6.8 10.2 5.7 13.9"/><path pathLength="1" d="M5.7 13.9 Q2.4 12.1 0.0 15.0"/><path pathLength="1" d="M26.0 0.0 Q20.9 4.2 24.0 9.9"/><path pathLength="1" d="M24.0 9.9 Q17.7 11.8 18.4 18.4"/><path pathLength="1" d="M18.4 18.4 Q11.8 17.7 9.9 24.0"/><path pathLength="1" d="M9.9 24.0 Q4.2 20.9 0.0 26.0"/><path pathLength="1" d="M37.0 0.0 Q29.8 5.9 34.2 14.2"/><path pathLength="1" d="M34.2 14.2 Q25.2 16.9 26.2 26.2"/><path pathLength="1" d="M26.2 26.2 Q16.9 25.2 14.2 34.2"/><path pathLength="1" d="M14.2 34.2 Q5.9 29.8 0.0 37.0"/><path pathLength="1" d="M48.0 0.0 Q38.6 7.7 44.3 18.4"/><path pathLength="1" d="M44.3 18.4 Q32.7 21.9 33.9 33.9"/><path pathLength="1" d="M33.9 33.9 Q21.9 32.7 18.4 44.3"/><path pathLength="1" d="M18.4 44.3 Q7.7 38.6 0.0 48.0"/><path pathLength="1" d="M59.0 0.0 Q47.5 9.4 54.5 22.6"/><path pathLength="1" d="M54.5 22.6 Q40.2 26.9 41.7 41.7"/><path pathLength="1" d="M41.7 41.7 Q26.9 40.2 22.6 54.5"/><path pathLength="1" d="M22.6 54.5 Q9.4 47.5 0.0 59.0"/>';
  function webSVG(){ return '<svg class="cobweb-svg" viewBox="-4 -4 84 84" aria-hidden="true"><g>' + COBWEB_PATHS + '</g></svg>'; }

  var viewDate = new Date();
  viewDate.setHours(12,0,0,0);

  var fmtWeekday = new Intl.DateTimeFormat('fa-IR', { weekday:'long' });
  var fmtDayMonth = new Intl.DateTimeFormat('fa-IR', { day:'numeric', month:'long' });
  var fmtDay = new Intl.DateTimeFormat('fa-IR', { day:'numeric' });
  var fmtYear = new Intl.DateTimeFormat('fa-IR', { year:'numeric' });
  var fmtParts = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year:'numeric', month:'numeric', day:'numeric' });

  function dateKey(d){
    var y='', m='', day='';
    fmtParts.formatToParts(d).forEach(function(p){
      if(p.type==='year') y = faToEn(p.value);
      else if(p.type==='month') m = faToEn(p.value);
      else if(p.type==='day') day = faToEn(p.value);
    });
    return y + '-' + m + '-' + day;
  }

  var listEl = document.getElementById('taskList');
  var emptyEl = document.getElementById('emptyState');
  var inputEl = document.getElementById('taskInput');
  var pendingEnterId = null;

  function tasks(){ return store[dateKey(viewDate)] || []; }
  function setTasks(t){ store[dateKey(viewDate)] = t; save(); }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function renderDate(){
    document.getElementById('weekday').textContent = fmtWeekday.format(viewDate);
    document.getElementById('dateMain').textContent = fmtDayMonth.format(viewDate) + ' ' + fmtYear.format(viewDate);
  }

  function renderProgress(){
    var ts = tasks();
    var done = ts.filter(function(t){ return t.done; }).length;
    document.getElementById('progressText').textContent = faNum(done) + ' از ' + faNum(ts.length);
    document.getElementById('progressFill').style.width = ts.length ? (done/ts.length*100) + '%' : '0%';
  }

  function renderList(){
    var ts = tasks();
    listEl.innerHTML = '';
    emptyEl.style.display = ts.length ? 'none' : 'block';
    ts.forEach(function(t){
      var li = document.createElement('li');
      var stale = isStale(t);
      li.className = 'task' + (t.done ? ' done' : '') + (t.id === pendingEnterId ? ' enter' : '') + (stale ? ' cobweb' : '');
      li.setAttribute('data-tid', t.id);
      li.innerHTML = (stale ? webSVG() : '') +
        '<button class="check" aria-label="انجام شد"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l5 5L19 7" stroke="#FAF5EA" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<span class="task-text">' + esc(t.text) + '</span>' +
        '<button class="del" aria-label="حذف">×</button>';
      li.querySelector('.check').addEventListener('click', function(){
        var all = tasks();
        var it = all.find(function(x){ return x.id === t.id; });
        if(!it) return;
        it.done = !it.done; setTasks(all);
        li.classList.toggle('done', it.done);
        if(it.done){
          var web = li.querySelector('.cobweb-svg');
          if(web){
            web.classList.add('falling');
            setTimeout(function(){ web.remove(); li.classList.remove('cobweb'); }, 720);
          }
        } else if(isStale(it) && !li.querySelector('.cobweb-svg')){
          li.classList.add('cobweb');
          li.insertAdjacentHTML('afterbegin', webSVG());
        }
        var cb = li.querySelector('.check');
        cb.classList.remove('pop'); void cb.offsetWidth; cb.classList.add('pop');
        renderProgress();
      });
      li.querySelector('.del').addEventListener('click', function(){
        li.classList.add('leaving');
        setTimeout(function(){
          setTasks(tasks().filter(function(x){ return x.id !== t.id; }));
          renderList(); renderProgress();
        }, 370);
      });
      listEl.appendChild(li);
    });
    pendingEnterId = null;
  }

  function render(){ renderDate(); renderProgress(); renderList(); }

  function addTask(){
    var v = inputEl.value.trim();
    if(!v) return;
    var ts = tasks();
    var nt = { id: uid(), text: v, done: false, createdAt: Date.now() };
    ts.push(nt);
    setTasks(ts);
    pendingEnterId = nt.id;
    inputEl.value = '';
    inputEl.focus();
    renderList(); renderProgress();
  }

  function goDay(delta){
    var outCls = delta > 0 ? 'pg-next-out' : 'pg-prev-out';
    var inCls = delta > 0 ? 'pg-next-in' : 'pg-prev-in';
    var wrap = document.querySelector('.wrap');
    wrap.classList.add(outCls);
    setTimeout(function(){
      viewDate.setDate(viewDate.getDate() + delta);
      renderDate(); renderList(); renderProgress();
      wrap.classList.remove(outCls);
      wrap.classList.add(inCls);
      setTimeout(function(){ wrap.classList.remove(inCls); }, 620);
    }, 300);
  }

  document.getElementById('addBtn').addEventListener('click', addTask);
  inputEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') addTask(); });
  document.getElementById('prevBtn').addEventListener('click', function(){ goDay(-1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ goDay(1); });
  document.getElementById('todayBtn').addEventListener('click', function(){
    viewDate = new Date(); viewDate.setHours(12,0,0,0); render();
  });

  function renderReport(){
    var days = [];
    var now = new Date(); now.setHours(12,0,0,0);
    var maxDone = 0, totalDone = 0, bestIdx = -1;
    for(var i=6;i>=0;i--){
      var d = new Date(now); d.setDate(d.getDate()-i);
      var ts = store[dateKey(d)] || [];
      var done = ts.filter(function(t){ return t.done; }).length;
      days.push({ date:d, done:done, total:ts.length });
      totalDone += done;
      if(done > maxDone){ maxDone = done; bestIdx = days.length-1; }
    }
    document.getElementById('statDone').textContent = faNum(totalDone);
    var avg = Math.round(totalDone/7*10)/10;
    document.getElementById('statAvg').textContent = faNum(String(avg)).replace('.', '٫');
    document.getElementById('statBest').textContent = bestIdx >= 0 ? fmtWeekday.format(days[bestIdx].date) : '—';

    var chart = document.getElementById('chart');
    chart.innerHTML = '';
    days.forEach(function(dy, idx){
      var col = document.createElement('div');
      col.className = 'bar-col' + (idx === bestIdx ? ' best' : '');
      var h = maxDone ? Math.max(dy.done/maxDone*100, dy.done ? 7 : 0) : 0;
      col.innerHTML =
        '<div class="bar-count">' + faNum(dy.done) + (dy.total ? ' <small>از ' + faNum(dy.total) + '</small>' : '') + '</div>' +
        '<div class="bar-track"><div class="bar-fill"></div></div>' +
        '<div class="bar-day">' + fmtWeekday.format(dy.date) + '</div>' +
        '<div class="bar-date">' + faNum(fmtDay.format(dy.date)) + '</div>';
      chart.appendChild(col);
      (function(fill, hh, k){
        setTimeout(function(){ fill.style.transitionDelay = (k*70)+'ms'; fill.style.height = hh+'%'; }, 80);
      })(col.querySelector('.bar-fill'), h, idx);
    });

    var note;
    if(totalDone === 0) note = 'هنوز تسکی کامل نشده؛ از امروز شروع کن.';
    else if(totalDone < 7) note = 'شروع خوبیه — قدم‌های کوچیک، هر روز.';
    else if(totalDone < 15) note = 'هفته‌ی پرکاری داشتی؛ همین فرمون رو ادامه بده.';
    else note = 'فوق‌العاده‌ست! این ریتم رو نگه دار.';
    document.getElementById('reportNote').textContent = note;
  }

  var mainView = document.getElementById('mainView');
  var reportView = document.getElementById('reportView');
  document.getElementById('reportBtn').addEventListener('click', function(){
    renderReport();
    reportView.hidden = false;
    window.scrollTo(0, 0);
    mainView.classList.add('view-out-l');
    reportView.classList.add('view-in-r');
    setTimeout(function(){ mainView.hidden = true; mainView.classList.remove('view-out-l'); }, 300);
    setTimeout(function(){ reportView.classList.remove('view-in-r'); }, 620);
  });
  document.getElementById('backBtn').addEventListener('click', function(){
    mainView.hidden = false;
    window.scrollTo(0, 0);
    reportView.classList.add('view-out-r');
    mainView.classList.add('view-in-l');
    setTimeout(function(){ reportView.hidden = true; reportView.classList.remove('view-out-r'); }, 300);
    setTimeout(function(){ mainView.classList.remove('view-in-l'); }, 620);
  });

  setInterval(function(){ renderList(); }, 60000);

  render();
})();
</script>
</body>
</html>
